<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeRush — Test de vitesse</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0b1020;--card:#121a2d;--card2:#18233b;--text:#eef3ff;
  --muted:#91a0bd;--accent:#7c5cff;--accent2:#20d9a4;--danger:#ff5577;
}
body{
  margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:radial-gradient(circle at 20% 10%,#202b58 0,transparent 35%),
             radial-gradient(circle at 90% 90%,#143d46 0,transparent 35%),var(--bg);
  color:var(--text);display:flex;justify-content:center;padding:35px 18px;
}
.app{width:min(1000px,100%)}
header{text-align:center;margin-bottom:24px}
.logo{font-size:14px;letter-spacing:3px;color:var(--accent2);font-weight:800}
h1{font-size:clamp(34px,6vw,58px);margin:8px 0}
.subtitle{color:var(--muted);margin:0}
.panel{
  background:rgba(18,26,45,.88);border:1px solid rgba(255,255,255,.08);
  border-radius:24px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.35);backdrop-filter:blur(12px)
}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
button,.select{
  border:0;border-radius:12px;padding:12px 16px;background:var(--card2);color:var(--text);
  cursor:pointer;font-weight:700;transition:.2s
}
button:hover{transform:translateY(-2px);background:#253252}
button.active{background:var(--accent)}
#newGame{margin-left:auto;background:var(--accent2);color:#071b16}
.timer-control{display:flex;align-items:center;gap:8px;background:var(--card2);padding:7px 10px 7px 13px;border-radius:12px;font-weight:700}
.timer-control span{font-size:13px}
.timer-control select,.timer-control input{border:0;border-radius:8px;background:#0d1527;color:var(--text);padding:8px 9px;outline:none;font-weight:700}
.timer-control input{width:75px}
.timer-control select:focus,.timer-control input:focus{box-shadow:0 0 0 2px var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:rgba(255,255,255,.04);border-radius:16px;padding:14px;text-align:center}
.stat strong{display:block;font-size:27px;margin-top:4px}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.textbox{
  min-height:190px;padding:24px;background:#0d1527;border-radius:18px;
  font-size:23px;line-height:1.8;letter-spacing:.3px;user-select:none
}
.char.correct{color:var(--accent2)}
.char.wrong{color:var(--danger);text-decoration:underline}
.char.current{border-left:2px solid var(--accent);animation:blink .8s infinite}
@keyframes blink{50%{border-color:transparent}}
#input{
  width:100%;margin-top:14px;min-height:105px;resize:none;border:1px solid #2b3856;
  background:#0a1120;color:var(--text);border-radius:16px;padding:17px;font-size:18px;outline:none
}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.progress{height:7px;background:#222d46;border-radius:99px;overflow:hidden;margin-top:16px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.1s}
.result{display:none;text-align:center;padding:25px 10px}
.result.show{display:block}
.result .big{font-size:65px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.resultBox{background:rgba(255,255,255,.04);padding:16px;border-radius:14px}
.resultBox b{font-size:24px;display:block}
.help{color:var(--muted);text-align:center;font-size:13px;margin-top:16px}
@media(max-width:650px){
 .stats,.grid{grid-template-columns:repeat(2,1fr)}
 .textbox{font-size:19px}
 .timer-control{width:100%;justify-content:space-between}
 #newGame{margin-left:0}
}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="logo">TYPERUSH</div>
  <h1>Teste ta vitesse</h1>
  <p class="subtitle">Tape le texte le plus vite et le plus précisément possible.</p>
</header>

<section class="panel">
  <div class="controls">
    <button class="diff active" data-diff="easy">Facile</button>
    <button class="diff" data-diff="medium">Moyen</button>
    <button class="diff" data-diff="hard">Difficile</button>
    <label class="timer-control">
      <span>⏱️ Temps</span>
      <select id="timerSelect" aria-label="Durée du test">
        <option value="15">15 secondes</option>
        <option value="30" selected>30 secondes</option>
        <option value="60">1 minute</option>
        <option value="120">2 minutes</option>
        <option value="custom">Personnalisé</option>
      </select>
      <input id="customTime" type="number" min="5" max="600" value="30"
             aria-label="Durée personnalisée en secondes" hidden>
    </label>
    <button id="newGame">↻ Nouvelle partie</button>
  </div>

  <div class="stats">
    <div class="stat"><span>Temps</span><strong id="time">30</strong></div>
    <div class="stat"><span>Vitesse</span><strong id="wpm">0</strong></div>
    <div class="stat"><span>Précision</span><strong id="accuracy">100%</strong></div>
    <div class="stat"><span>Erreurs</span><strong id="errors">0</strong></div>
  </div>

  <div id="game">
    <div id="text" class="textbox"></div>
    <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off"
      placeholder="Clique ici et commence à taper..."></textarea>
    <div class="progress"><div id="bar"></div></div>
    <p class="help">Le chrono démarre automatiquement. Les phrases s’enchaînent sans répétition pendant la partie.</p>
  </div>

  <div id="result" class="result">
    <div class="big" id="finalWpm">0</div>
    <div>mots par minute</div>
    <div class="grid">
      <div class="resultBox"><b id="finalAccuracy">0%</b>Précision</div>
      <div class="resultBox"><b id="finalErrors">0</b>Erreurs</div>
      <div class="resultBox"><b id="finalTime">0 s</b>Temps</div>
    </div>
    <p id="best"></p>
    <button id="again">Rejouer</button>
  </div>
</section>
</main>

<script>
const texts={
 easy:[
  "Le petit renard traverse la forêt pendant que le soleil se lève.",
  "Aujourd'hui est une bonne journée pour apprendre quelque chose de nouveau.",
  "La vitesse vient avec la pratique et la précision reste toujours importante.",
  "Un clavier bien maîtrisé permet d'écrire plus vite et plus confortablement.",
  "Le chat observe tranquillement les oiseaux depuis la fenêtre.",
  "Une promenade au bord de la mer permet de profiter du calme et du vent.",
  "Le soleil éclaire doucement les maisons au début de la matinée.",
  "Chaque nouvelle tentative permet de progresser un peu plus.",
  "Un bon rythme de frappe commence toujours par une bonne position des mains.",
  "Les nuages avancent lentement au-dessus des montagnes.",
  "Le jardin devient magnifique lorsque les fleurs commencent à s'ouvrir.",
  "Une tasse de chocolat chaud réchauffe les mains pendant une soirée froide.",
  "Le chien court dans le parc à la recherche de sa balle préférée.",
  "Lire régulièrement permet de découvrir de nouvelles histoires et de nouveaux mots.",
  "Le vent fait bouger les feuilles des arbres dans toute la rue.",
  "Une bonne organisation permet de terminer les tâches plus facilement.",
  "Le matin, les oiseaux chantent dans les arbres derrière la maison.",
  "Il faut parfois prendre son temps pour apprendre correctement quelque chose.",
  "Une idée simple peut devenir un grand projet avec beaucoup de travail.",
  "Le clavier devient plus facile à utiliser lorsque les doigts connaissent leur chemin.",
  "Lorsque la pluie commence à tomber, les rues deviennent brillantes sous les lumières de la ville.",
  "Pour progresser rapidement, il faut garder un rythme régulier sans chercher uniquement à battre son record.",
  "Les nouvelles technologies permettent de créer des projets intéressants avec quelques lignes de code.",
  "La concentration, la mémoire musculaire et la précision sont essentielles pour améliorer sa frappe.",
  "Un ordinateur rapide est pratique, mais une bonne méthode de travail est encore plus importante.",
  "Chaque seconde compte lorsque deux joueurs essaient de battre leur meilleur score.",
  "Le développement d'un logiciel demande souvent plusieurs essais avant d'obtenir le résultat souhaité.",
  "Une erreur dans un programme peut parfois devenir une occasion intéressante d'apprendre.",
  "Les jeux vidéo modernes utilisent de nombreuses technologies pour créer des mondes impressionnants.",
  "Un objectif clair permet de rester motivé même lorsque l'exercice devient difficile.",
  "Le meilleur moyen de progresser est de pratiquer régulièrement pendant quelques minutes chaque jour.",
  "Une équipe efficace communique clairement et partage ses idées avec les autres.",
  "Les montagnes paraissent immenses lorsque l'on observe leur sommet depuis la vallée.",
  "Un bon joueur sait quand prendre des risques et quand rester prudent."
 ],
 medium:[
  "Les livres permettent de voyager très loin sans avoir besoin de quitter sa chambre.",
  "Un projet réussi commence souvent par une petite idée qui évolue avec le temps.",
  "La musique peut aider certaines personnes à rester concentrées pendant leur travail.",
  "Une bonne connexion internet rend les activités en ligne beaucoup plus agréables.",
  "Le ciel change rapidement de couleur lorsque le soleil disparaît derrière l'horizon.",
  "Apprendre à taper sans regarder le clavier demande de la patience et de la répétition.",
  "Le train arrive en gare tandis que les voyageurs se préparent à monter.",
  "Une carte bien détaillée permet de retrouver facilement son chemin dans une grande ville.",
  "Les développeurs testent leurs applications afin de détecter les problèmes avant leur publication.",
  "Une petite amélioration répétée chaque jour peut produire un résultat impressionnant après plusieurs mois.",
  "Le courage ne signifie pas ne jamais avoir peur, mais continuer malgré les difficultés.",
  "Un bon entraînement permet d'améliorer progressivement la vitesse et la précision.",
  "Les étoiles deviennent visibles lorsque la nuit est suffisamment sombre.",
  "Un navigateur internet permet d'accéder rapidement à des milliers de sites différents.",
  "Les océans couvrent une grande partie de notre planète et abritent de nombreuses espèces.",
  "Créer quelque chose soi-même donne souvent une grande satisfaction lorsque le projet fonctionne enfin.",
  "Une bonne mémoire musculaire permet aux doigts de bouger presque automatiquement.",
  "Les couleurs du coucher de soleil changent selon les nuages et la lumière.",
  "Il est important de vérifier son travail avant de considérer une tâche comme terminée.",
  "Les robots peuvent effectuer certaines tâches répétitives avec une grande précision.",
  "Une journée bien organisée laisse davantage de temps pour les activités que l'on apprécie.",
  "Le bruit de la pluie contre les fenêtres peut rendre une soirée particulièrement agréable.",
  "Un problème compliqué devient souvent plus simple lorsqu'il est divisé en plusieurs petites étapes.",
  "Les ordinateurs modernes peuvent effectuer des millions de calculs en très peu de temps.",
  "Une bonne question peut parfois conduire à une découverte complètement inattendue.",
  "Les jeux de stratégie demandent souvent de réfléchir plusieurs coups à l'avance.",
  "Le printemps transforme progressivement les paysages avec de nouvelles couleurs.",
  "Une équipe soudée peut réussir des projets qui semblaient impossibles au départ.",
  "Le vent souffle doucement tandis que les vagues arrivent sur la plage.",
  "Apprendre une nouvelle compétence demande du temps, mais chaque progrès compte.",
  "Les informations trouvées sur internet doivent parfois être vérifiées avant d'être utilisées.",
  "Un espace de travail bien rangé permet de mieux se concentrer sur les tâches importantes.",
  "Les grandes inventions commencent souvent par une observation très simple."
 ],
 hard:[
  "Une randonnée en montagne permet de découvrir des paysages difficiles à voir depuis la ville.",
  "Le café du matin donne à certaines personnes l'énergie nécessaire pour commencer leur journée.",
  "Les étoiles semblent immobiles, même si notre planète se déplace constamment dans l'espace.",
  "Un bon entraînement doit être suffisamment difficile pour faire progresser sans décourager.",
  "Les jeux rapides demandent de bonnes réactions et une excellente concentration.",
  "Une sauvegarde régulière permet d'éviter de perdre plusieurs heures de travail.",
  "Les mots deviennent plus faciles à taper lorsque l'on arrête de chercher chaque lettre.",
  "Un objectif précis permet de mesurer facilement les progrès réalisés au fil du temps.",
  "Les animaux utilisent de nombreuses façons différentes pour communiquer entre eux.",
  "Une ville devient particulièrement animée lorsque les rues commencent à se remplir le matin.",
  "Le silence d'une forêt peut être impressionnant après plusieurs heures passées dans une ville.",
  "Un bon logiciel doit être rapide, fiable et simple à utiliser.",
  "Les nouvelles idées apparaissent parfois lorsque l'on prend une pause pour réfléchir.",
  "Une bonne préparation rend les tâches difficiles beaucoup moins stressantes.",
  "Le soleil se reflète sur l'eau et crée de petits éclats lumineux.",
  "Les ordinateurs sont devenus indispensables dans de nombreux métiers modernes.",
  "Un exercice régulier permet d'améliorer la coordination entre les yeux et les mains.",
  "Les explorateurs doivent souvent préparer leur équipement avant de partir vers une région inconnue.",
  "Une histoire captivante peut faire oublier complètement le temps qui passe.",
  "Les montagnes enneigées offrent un spectacle impressionnant pendant les journées ensoleillées.",
  "Une bonne stratégie consiste à observer la situation avant de prendre une décision.",
  "Les jeux multijoueurs demandent autant de communication que de rapidité.",
  "Une connexion stable est importante lorsqu'on participe à une partie en ligne.",
  "Le bruit des vagues accompagne les promeneurs qui marchent près du rivage.",
  "Les développeurs corrigent régulièrement les erreurs afin d'améliorer leurs applications.",
  "Une compétence devient plus naturelle lorsque l'on la pratique suffisamment longtemps.",
  "Le clavier permet de transformer rapidement les idées en texte.",
  "Une bonne précision est souvent plus utile qu'une vitesse excessive.",
  "Les petits objectifs sont plus faciles à atteindre lorsqu'ils sont organisés dans un ordre logique.",
  "Un nouveau projet peut sembler compliqué avant d'avoir été découpé en plusieurs étapes.",
  "Les connaissances s'accumulent progressivement lorsque l'on apprend un peu chaque jour.",
  "Le monde numérique évolue rapidement et crée régulièrement de nouvelles possibilités.",
  "Une bonne concentration permet de remarquer des détails que l'on aurait facilement ignorés.",
  "Le meilleur score n'est pas toujours le plus important, car la régularité compte aussi.",
  "Chaque erreur corrigée permet de mieux comprendre la façon dont on peut progresser.",
  "Une longue journée paraît plus courte lorsque l'on passe du temps à faire quelque chose que l'on aime.",
  "Les idées les plus simples peuvent parfois produire les résultats les plus efficaces.",
  "Un bon entraînement commence par des exercices faciles avant de passer à des défis plus difficiles.",
  "Les progrès sont souvent plus visibles lorsque l'on compare ses résultats après plusieurs semaines.",
  "Une phrase correctement tapée vaut mieux qu'une phrase rapide remplie d'erreurs."
 ]
};

let difficulty="easy", target="", started=false, finished=false, startTime=0, timer=null;
let duration=30;
let remainingTexts=[];
let totalCorrect=0, totalTyped=0, totalErrors=0;
const $=id=>document.getElementById(id);
const input=$("input");

function refillPhrasePool(){
 remainingTexts=[...texts[difficulty]];
 // Mélange Fisher-Yates : chaque phrase n'est tirée qu'une fois par partie.
 for(let i=remainingTexts.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [remainingTexts[i],remainingTexts[j]]=[remainingTexts[j],remainingTexts[i]];
 }
}
function randomText(){
 if(remainingTexts.length===0) refillPhrasePool();
 return remainingTexts.pop();
}
function render(){
 $("text").innerHTML="";
 [...target].forEach((c,i)=>{
   const s=document.createElement("span");
   s.className="char"+(i===0?" current":"");
   s.textContent=c;
   $("text").appendChild(s);
 });
}
function getDuration(){
 const value=$("timerSelect").value;
 if(value==="custom"){
   const n=Number($("customTime").value);
   return Math.min(600,Math.max(5,Number.isFinite(n)?Math.round(n):30));
 }
 return Number(value);
}
$("timerSelect").addEventListener("change",()=>{
 const custom=$("timerSelect").value==="custom";
 $("customTime").hidden=!custom;
 if(custom) $("customTime").focus();
 duration=getDuration();
 reset();
});
$("customTime").addEventListener("change",()=>{
 duration=getDuration();
 $("customTime").value=duration;
 reset();
});

function reset(){
 duration=getDuration();
 clearInterval(timer); started=false;finished=false;startTime=0;
 // Une nouvelle partie recommence un nouveau cycle sans répétition.
 refillPhrasePool();
 target=randomText(); input.value=""; input.disabled=false; input.focus();
 totalCorrect=0; totalTyped=0; totalErrors=0;
 $("time").textContent=duration;$("wpm").textContent=0;$("accuracy").textContent="100%";$("errors").textContent=0;
 $("bar").style.width="0%";$("game").style.display="block";$("result").classList.remove("show");render();
}
function update(){
 const typed=input.value;
 let correct=0;
 [...target].forEach((c,i)=>{
   const el=$("text").children[i];
   if(!el)return;
   el.className="char";
   if(i<typed.length) el.classList.add(typed[i]===c?"correct":"wrong");
   if(typed[i]===c) correct++;
 });
 if($("text").children[typed.length]) $("text").children[typed.length].classList.add("current");

 const elapsed=Math.max((Date.now()-startTime)/1000,.1);
 const currentErrors=[...typed].filter((c,i)=>c!==target[i]).length;
 const currentDone=Math.min(typed.length,target.length);
 // Stats affichées pendant la partie : total des caractères validés jusqu'ici.
 const liveCorrect=totalCorrect+correct;
 const liveTyped=totalTyped+currentDone;
 const liveErrors=totalErrors+currentErrors;
 const words=liveCorrect/5;
 const wpm=Math.round(words/(elapsed/60));
 const acc=liveTyped?Math.round(liveCorrect/liveTyped*100):100;

 $("wpm").textContent=wpm;
 $("accuracy").textContent=acc+"%";
 $("errors").textContent=liveErrors;
 $("bar").style.width=Math.min(100,typed.length/target.length*100)+"%";

 if(typed.length>=target.length){
   totalCorrect+=correct;
   totalTyped+=target.length;
   totalErrors+=currentErrors;
   if((Date.now()-startTime)/1000 < duration) nextPhrase();
   else finish();
 }
}
function nextPhrase(){
 if(finished)return;
 target=randomText();
 input.value="";
 render();
 input.focus();
}
function start(){
 if(started)return;
 started=true;startTime=Date.now();
 timer=setInterval(()=>{
   const left=Math.max(0,duration-Math.floor((Date.now()-startTime)/1000));
   $("time").textContent=left;
   if(left<=0) finish();
 },100);
}
function finish(){
 if(finished)return;
 finished=true; clearInterval(timer); input.disabled=true;

 // Ajouter la dernière phrase partiellement tapée au résultat.
 const typed=input.value;
 const currentCorrect=[...typed].filter((c,i)=>c===target[i]).length;
 const currentTyped=Math.min(typed.length,target.length);
 const currentErrors=[...typed].filter((c,i)=>c!==target[i]).length;

 const finalCorrect=totalCorrect+currentCorrect;
 const finalTyped=totalTyped+currentTyped;
 const finalErrors=totalErrors+currentErrors;
 const elapsed=Math.min(duration,Math.max(.1,(Date.now()-startTime)/1000));
 const acc=finalTyped?Math.round(finalCorrect/finalTyped*100):100;
 const wpm=Math.round((finalCorrect/5)/(elapsed/60));

 $("finalWpm").textContent=wpm;
 $("finalAccuracy").textContent=acc+"%";
 $("finalErrors").textContent=finalErrors;
 $("finalTime").textContent=Math.round(elapsed)+" s";

 const key="typerush-best-"+difficulty,best=Number(localStorage.getItem(key)||0);
 if(wpm>best){localStorage.setItem(key,wpm);$("best").textContent="🏆 Nouveau record !";}
 else $("best").textContent="Record : "+best+" MPM";

 $("game").style.display="none";
 $("result").classList.add("show");
}
$("newGame").onclick=reset;$("again").onclick=reset;
input.addEventListener("input",()=>{
 if(!started) start();
 update();
});

document.querySelectorAll(".diff").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".diff").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");difficulty=btn.dataset.diff;reset();
});
reset();
</script>
</body>
</html>
